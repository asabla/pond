name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod sets the oldest Go that builds pond; test and ship with the
          # current stable release, which has the standard library's security fixes.
          go-version: stable
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Copy this file into Casks/ in asabla/homebrew-tap to publish the release.
      - name: Attach the Homebrew cask
        run: |
          cask=$(find dist -name pond.rb | head -n 1)
          test -n "$cask" || { echo "GoReleaser wrote no pond.rb"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "$cask"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
