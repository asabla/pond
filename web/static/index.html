<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pond</title>
  <meta name="description" content="Local data lakes, one workspace at a time. Agents can drive this page through WebMCP.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 19c0-6 6-10 13-10s13 4 13 10-6 7-13 7S3 25 3 19z' fill='%2317594f'/%3E%3Cpath d='M9 18c2-3 5-4 7-4s5 1 7 4' fill='none' stroke='%23b8d45a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply a chosen theme before the first paint, so dark mode doesn't flash light.
    try {
      const t = JSON.parse(localStorage.getItem("pond.theme"));
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <script type="module" src="/workbench.js"></script>
</head>
<body>
  <header class="titlebar">
    <button class="icon-btn nav-btn" id="nav-btn" aria-label="Hide sidebar" aria-expanded="true" aria-controls="nav"><span class="ico ico-menu" aria-hidden="true"></span></button>
    <a class="brand" href="#" aria-label="Pond">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path class="brand-water" d="M3 19c0-6 6-10 13-10s13 4 13 10-6 7-13 7S3 25 3 19z"/><path class="brand-ripple" d="M9 18c2-3 5-4 7-4s5 1 7 4"/></svg>
      <span>pond</span>
    </a>
    <button class="workspace-btn" id="workspace-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="workspace-picker"><span id="workspace-name">Workspace</span><span class="workspace-chevron" aria-hidden="true">⌄</span></button>
    <span id="active-context" class="context-path"></span>
    <div class="titlebar-end">
      <button class="icon-btn" id="theme-btn" aria-label="Theme"><span class="ico ico-theme" aria-hidden="true"></span></button>
      <button class="activity-btn" id="activity-btn" aria-label="Activity" aria-expanded="false" aria-controls="activity">
        <span class="ico ico-activity" aria-hidden="true"></span><span class="activity-btn-text">Activity</span><b id="activity-count" hidden></b>
      </button>
    </div>
  </header>

  <div class="workbench">
    <nav class="nav" id="nav" aria-label="Workspace navigation">
      <div class="nav-head">
        <input id="filter" class="input" type="search" placeholder="Filter" autocomplete="off" spellcheck="false" aria-label="Filter tables, queries and graphs">
        <button class="icon-btn" id="refresh-nav" title="Reload" aria-label="Reload workspace"><span class="ico ico-refresh" aria-hidden="true"></span></button>
      </div>
      <div class="nav-contexts" id="nav-contexts"></div>
    </nav>

    <main class="main" id="main">
      <div id="connection-status" class="connection-notice" role="status" hidden></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Open items"></div>
      <div class="panels" id="panels"></div>
    </main>

    <aside class="activity" id="activity" hidden aria-label="Activity">
      <header class="activity-head">
        <h2>Activity</h2>
        <button class="icon-btn" id="activity-close" aria-label="Hide activity"><span class="ico ico-close" aria-hidden="true"></span></button>
      </header>
      <div class="activity-agents">
        <p id="webmcp-status"></p><p id="agent-context"></p><p>These confirmations apply to browser agents on this page. External MCP clients use their own approval controls. Python can change data. Activity lasts until this page reloads.</p>
        <label class="check"><input type="checkbox" id="trust"> Browser agent confirmations: ask before deleting or replacing data</label>
      </div>
      <ol class="activity-log" id="activity-log"></ol>
    </aside>
  </div>

  <dialog class="workspace-picker" id="workspace-picker" aria-labelledby="workspace-picker-title">
    <div class="workspace-picker-head"><h2 id="workspace-picker-title">Workspaces</h2><button class="icon-btn" id="workspace-close" aria-label="Close workspace list"><span class="ico ico-close" aria-hidden="true"></span></button></div>
    <input id="workspace-search" class="input" type="search" placeholder="Find a workspace" autocomplete="off" spellcheck="false" aria-label="Find workspace by name or path">
    <ul id="workspace-list" class="workspace-list" aria-label="Workspaces"></ul>
    <p class="help">Start a workspace with <code>pond DIR</code>. Removing a stopped entry keeps its data.</p>
  </dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
